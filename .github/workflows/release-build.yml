name: Build APK

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release:
        description: "构建 Release APK（需先配置签名 secrets）"
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionName 依赖 git rev-list --count，浅克隆会算成 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK & build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          cargo --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        id: keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置签名 secrets，回退为 Debug 构建"
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          AutoReleaseBuildRust: "1" # Debug 构建时 Rust 也用 debug 模式，省一半编译时间
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ "${{ steps.keystore.outputs.signing }}" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MX-${{ github.sha }}
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/*.apk
